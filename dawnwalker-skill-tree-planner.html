  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    color:var(--parchment);
    font-family:'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif;
    overflow:hidden;
  }

    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding-top:64px;
    background:
      radial-gradient(ellipse at center, rgba(20,10,10,0.2) 0%, rgba(0,0,0,0.95) 80%),
      #000;
    overflow:auto;
  }

  /* ---------- Top header banner ---------- */
  .topbar{
    position:fixed;
    top:0; left:0; right:0;
    z-index:60;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px 12px 8px;
    background:linear-gradient(180deg, rgba(12,7,5,0.97), rgba(12,7,5,0.75) 80%, transparent);
    border-bottom:1px solid rgba(201,162,75,0.35);
    pointer-events:none;
  }
  .topbar .title{
    font-size:20px;
    font-weight:700;
    letter-spacing:2px;
    color:var(--gold-bright);
    text-shadow:0 0 12px rgba(241,217,139,0.55), 0 2px 2px #000;
  }
  .topbar .subtitle{
    margin-top:2px;
    font-family:Georgia,'Times New Roman',serif;
    font-style:italic;
    font-size:12.5px;
    letter-spacing:1px;
    color:var(--parchment);
    opacity:0.8;
  }

  /* ---------- Points panel (top-left) ---------- */
  .points-panel{
    position:fixed;
    top:14px;
    left:14px;
    z-index:70;
    min-width:214px;
    padding:10px 16px 12px;
    background:linear-gradient(180deg, rgba(30,18,10,0.94), rgba(10,6,4,0.96));
    border:1px solid var(--gold);
    border-radius:8px;
    box-shadow:0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(201,162,75,0.12);
  }
  .points-panel .pp-label{
    font-size:10.5px;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:var(--gold);
    opacity:0.9;
    margin-bottom:4px;
  }
  .points-panel .pp-value{
    font-size:22px;
    font-weight:700;
    color:var(--gold-bright);
    text-shadow:0 0 8px rgba(241,217,139,0.4);
    font-variant-numeric:tabular-nums;
  }
  .points-panel .pp-value .pp-total{
    font-size:15px;
    opacity:0.7;
    font-weight:400;
  }
  .points-panel .pp-bar{
    margin-top:8px;
    height:6px;
    border-radius:3px;
    background:rgba(255,255,255,0.08);
    overflow:hidden;
    border:1px solid rgba(201,162,75,0.3);
  }
  .points-panel .pp-bar-fill{
    height:100%;
    background:linear-gradient(90deg, var(--gold), var(--gold-bright));
    transition:width .25s ease, background .25s ease;
  }
  .points-panel .pp-bar-fill.over{
    background:linear-gradient(90deg, var(--red), var(--red-glow));
  }
  .points-panel .pp-reset{
    margin-top:10px;
    width:100%;
    padding:6px 8px;
    font-family:inherit;
    font-size:10.5px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--parchment);
    background:rgba(0,0,0,0.35);
    border:1px solid rgba(201,162,75,0.5);
    border-radius:5px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .points-panel .pp-reset:hover{
    background:rgba(194,59,59,0.35);
    border-color:var(--gold-bright);
    color:var(--gold-bright);
  }

  /* ---------- Legend ---------- */
  .legend{
    position:fixed;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:50;
    display:flex;
    gap:16px;
    padding:8px 18px;
    background:rgba(10,6,4,0.85);
    border:1px solid rgba(201,162,75,0.5);
    border-radius:8px;
    font-size:10.5px;
    letter-spacing:0.4px;
    color:var(--parchment);
    pointer-events:none;
  }
  .legend span{ display:flex; align-items:center; gap:6px; }
  .legend i{
    width:10px;height:10px;
    border-radius:50%;
    display:inline-block;
    flex:none;
  }
  .legend .dot-acquired{ background:var(--green-glow); box-shadow:0 0 6px 1px var(--green-glow); }
  .legend .dot-planned{ background:var(--orange-glow); box-shadow:0 0 6px 1px var(--orange-glow); animation:blinkDot 1.4s ease-in-out infinite; }
  .legend .dot-frozen{ background:var(--frozen); box-shadow:0 0 6px 1px var(--frozen); }
  .legend .dot-locked{ background:#666; }
  .legend .hint{ opacity:0.7; font-style:italic; }
  @keyframes blinkDot{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }

  /* ---------- Skill nodes ---------- */
  .node{
    position:absolute;
    aspect-ratio:1/1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    cursor:pointer;
    background:rgba(10,8,6,0.28);
    border:2px solid transparent;
    -webkit-tap-highlight-color:transparent;
    padding:0;
  }
  .node:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:3px; }

  .node::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.12);
    transition:all .2s ease;
  }
  .node::after{
    content:"";
    position:absolute;
    inset:22%;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    transition:all .2s ease;
  }

  .node:hover::before{
    border-color:rgba(255,255,255,0.7);
    box-shadow:0 0 16px 4px rgba(255,255,255,0.3);
    transform:scale(1.08);
  }

  /* Locked: dim grey, clearly inert but clickable */
  .node[data-status="locked"]::before{ border-color:rgba(160,160,160,0.55); }
  .node[data-status="locked"]::after{ background:rgba(120,120,120,0.18); }

  /* Planned: orange flare, intermittent */
  .node[data-status="planned"]::before{
    border-color:var(--orange-glow);
    box-shadow:0 0 10px 2px rgba(255,177,77,0.55);
    animation:flarePlanned 1.3s ease-in-out infinite;
  }
  .node[data-status="planned"]::after{ background:rgba(255,177,77,0.22); }
  @keyframes flarePlanned{
    0%,100%{ box-shadow:0 0 6px 1px rgba(255,177,77,0.28); opacity:0.8; }
    50%{ box-shadow:0 0 22px 6px rgba(255,177,77,0.95); opacity:1; }
  }

  /* Acquired: full tree-colored pulse */
  .node[data-status="acquired"].tree-sword::before{ border-color:var(--green-glow); box-shadow:0 0 12px 3px rgba(139,255,176,0.6); animation:pulseGreen 2.4s ease-in-out infinite; }
  .node[data-status="acquired"].tree-sword::after{ background:rgba(139,255,176,0.25); }
  .node[data-status="acquired"].tree-vamp::before{ border-color:var(--red-glow); box-shadow:0 0 12px 3px rgba(255,90,90,0.6); animation:pulseRed 2.4s ease-in-out infinite; }
  .node[data-status="acquired"].tree-vamp::after{ background:rgba(255,90,90,0.25); }
  .node[data-status="acquired"].tree-witch::before{ border-color:var(--purple-glow); box-shadow:0 0 12px 3px rgba(201,166,255,0.6); animation:pulsePurple 2.4s ease-in-out infinite; }
  .node[data-status="acquired"].tree-witch::after{ background:rgba(201,166,255,0.25); }

  @keyframes pulseGreen{ 0%,100%{ box-shadow:0 0 9px 2px rgba(139,255,176,0.4); } 50%{ box-shadow:0 0 20px 6px rgba(139,255,176,0.85); } }
  @keyframes pulseRed{ 0%,100%{ box-shadow:0 0 9px 2px rgba(255,90,90,0.4); } 50%{ box-shadow:0 0 20px 6px rgba(255,90,90,0.85); } }
  @keyframes pulsePurple{ 0%,100%{ box-shadow:0 0 9px 2px rgba(201,166,255,0.4); } 50%{ box-shadow:0 0 20px 6px rgba(201,166,255,0.85); } }

  /* Frozen: inert, non-interactive placeholder */
  .node[data-status="frozen"]{ cursor:not-allowed; }
  .node[data-status="frozen"]::before{
    border-color:rgba(127,214,255,0.45);
    box-shadow:0 0 6px 1px rgba(127,214,255,0.22);
  }
  .node[data-status="frozen"]::after{ background:rgba(127,214,255,0.12); }
  .node[data-status="frozen"]:hover::before{ transform:none; box-shadow:0 0 8px 2px rgba(127,214,255,0.3); border-color:rgba(127,214,255,0.6); }

  /* Ultimate nodes: slightly larger ring + gold accent even when locked */
  .node.ultimate::before{ border-width:2.5px; }

  /* ---------- Tooltip ---------- */
  .tooltip{
    position:fixed;
    z-index:200;
    max-width:320px;
    min-width:240px;
    padding:14px 16px 12px;
    background:var(--tt-bg);
    border:2px solid var(--gold);
    border-radius:4px;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.7),
      0 14px 34px rgba(0,0,0,0.9),
      inset 0 0 20px rgba(201,162,75,0.06);
    pointer-events:none;
    opacity:0;
    transform:translateY(6px) scale(0.98);
    transition:opacity .12s ease, transform .12s ease;
    font-family:Georgia,'Times New Roman',serif;
    color:#f5f2ea;
  }
  .tooltip.visible{ opacity:1; transform:translateY(0) scale(1); }
  .tooltip.tree-vamp{ border-color:#8a2f2f; }
  .tooltip.tree-witch{ border-color:#5d3f8f; }

  .tooltip .tt-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    border-bottom:1px solid rgba(201,162,75,0.4);
    padding-bottom:7px;
    margin-bottom:8px;
  }
  .tooltip .tt-name{
    font-family:'Cinzel',Georgia,serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.3px;
    color:var(--gold-bright);
    text-shadow:0 0 6px rgba(241,217,139,0.4);
  }
  .tooltip .tt-type{
    font-size:10.5px;
    color:#cfcac0;
    opacity:0.85;
    white-space:nowrap;
    font-style:italic;
  }
  .tooltip .tt-status{
    display:inline-block;
    margin-bottom:8px;
    padding:2px 9px;
    font-size:10px;
    letter-spacing:0.7px;
    text-transform:uppercase;
    border-radius:2px;
    border:1px solid currentColor;
  }
  .tooltip .tt-status.st-acquired{ color:var(--green-glow); }
  .tooltip.tree-vamp .tt-status.st-acquired{ color:var(--red-glow); }
  .tooltip.tree-witch .tt-status.st-acquired{ color:var(--purple-glow); }
  .tooltip .tt-status.st-planned{ color:var(--orange-glow); }
  .tooltip .tt-status.st-frozen{ color:var(--frozen); }
  .tooltip .tt-status.st-locked{ color:#999; }

  .tooltip .tt-desc{
    font-size:12.5px;
    line-height:1.6;
    color:#e9e5da;
  }
  .tooltip .tt-hint{
    margin-top:10px;
    padding-top:8px;
    border-top:1px solid rgba(201,162,75,0.25);
    font-size:10.5px;
    color:var(--gold);
    letter-spacing:0.2px;
    font-style:italic;
  }

  /* ---------- Column focus glow on hover ---------- */
  .col-highlight{
    position:absolute;
    top:0; bottom:0;
    width:33.33%;
    pointer-events:none;
    opacity:0;
    transition:opacity .3s ease;
    mix-blend-mode:screen;
  }
  .col-highlight.sword{ left:0; background:linear-gradient(90deg, rgba(94,168,50,0.08), transparent); }
  .col-highlight.vamp{ left:33.33%; background:radial-gradient(ellipse at center, rgba(194,59,59,0.08), transparent 70%); }
  .col-highlight.witch{ left:66.66%; background:linear-gradient(270deg, rgba(155,107,217,0.08), transparent); }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:#000; }
  ::-webkit-scrollbar-thumb{ background:#3a2a1a; border-radius:6px; }

  @media (max-width: 760px){
    .topbar .title{ font-size:14px; letter-spacing:1px; }
    .topbar .subtitle{ font-size:10px; }
    .points-panel{ min-width:150px; padding:8px 12px 10px; }
    .points-panel .pp-value{ font-size:17px; }
    .legend{ display:none; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="title">PLANIFICADOR DE HABILIDADES</div>
    <div class="subtitle">Build Híbrida de Coen</div>
  </div>

  <div class="points-panel">
    <div class="pp-label">Puntos de Habilidad Gastados</div>
    <div class="pp-value"><span id="ppSpent">0</span><span class="pp-total">/<span id="ppTotal">31</span></span></div>
    <div class="pp-bar"><div class="pp-bar-fill" id="ppBarFill"></div></div>
    <button class="pp-reset" id="ppReset" type="button">Reiniciar build</button>
  </div>

  <div class="stage">
    <div class="board" id="board">
      <div class="col-highlight sword" id="hl-sword"></div>
      <div class="col-highlight vamp" id="hl-vamp"></div>
      <div class="col-highlight witch" id="hl-witch"></div>
      <!-- Skill nodes are injected here by JavaScript from the SKILLS data set -->
    </div>
  </div>

  <div class="legend">
    <span><i class="dot-acquired"></i> Adquirida</span>
    <span><i class="dot-planned"></i> Planificada</span>
    <span><i class="dot-frozen"></i> Rama congelada</span>
    <span><i class="dot-locked"></i> Bloqueada</span>
    <span class="hint">— click en un nodo para alternar su estado —</span>
  </div>

  <div class="tooltip" id="tooltip"></div>

<script>
/* ============================================================
   DATABASE — todas las ventajas y habilidades del planificador.
   x,y: posición en % sobre el tablero (1536x1024).
   status inicial: 'acquired' | 'planned' | 'locked' | 'frozen'

  /* ---------------- ESGRIMA (SWORDMASTERY) ---------------- */

  { id:'sw_embestida', tree:'sword', x:10, y:85, ultimate:false,

  { id:'sw_golpe_arteria', tree:'sword', x:20, y:85, ultimate:false,
    name:'Golpe de Arteria (Artery Strike)', type:'Activa (2 Cargas)',

    initial:'locked' },

  { id:'sw_ultimate', tree:'sword', x:15, y:92, ultimate:true,
    name:'Fortaleza Andante', type:'Ventaja Definitiva',
    effect:'Te vuelve inmune a interrupciones y reduce el daño recibido un 80% durante 15 segundos. Desactiva otras Ultimates.',

  /* ---------------- VAMPIRISMO (VAMPIRISM) ---------------- */
  { id:'va_sangre_nutritiva', tree:'vamp', x:50, y:15, ultimate:false,
    name:'Sangre Nutritiva 1', type:'Pasiva',

  { id:'va_sed_eterna', tree:'vamp', x:50, y:25, ultimate:false,

  { id:'va_mordisco_voraz', tree:'vamp', x:50, y:40, ultimate:false,

    initial:'acquired' },

  { id:'va_transformacion', tree:'vamp', x:40, y:50, ultimate:false,
    name:'Transformación 1', type:'Activa de Exploración',
    effect:'Permite transformarse en lobo para moverse a gran velocidad por el Valle Sangora.',
    initial:'acquired' },

  { id:'va_shred', tree:'vamp', x:60, y:50, ultimate:false,
    name:'Shred (Desgarrar)', type:'Pasiva',
    effect:'Añade una probabilidad fija de aplicar el estado "Sangrado" con cada golpe de garras.',
    initial:'planned' },

  { id:'va_crimson_rush', tree:'vamp', x:50, y:65, ultimate:false,
    name:'Crimson Rush', type:'Pasiva',
    effect:'Escala el daño de tus habilidades cuanto mayor sea tu porcentaje de salud actual.',
    initial:'planned' },

  { id:'va_alarido', tree:'vamp', x:40, y:75, ultimate:false,
    name:'Alarido Perforante', type:'Activa (20% Vida)',
    effect:'Grito ultrasónico en cono que aturde y debilita la defensa y ataque del enemigo.',

  { id:'va_tormenta_sombras', tree:'vamp', x:60, y:75, ultimate:false,
    name:'Tormenta de Sombras (Shadowstorm)', type:'Activa (15% Vida)',
    effect:'Ralentiza el tiempo a tu alrededor en un área para esquivar o reposicionarte.',
    initial:'locked' },

  { id:'va_hipnotizar', tree:'vamp', x:45, y:85, ultimate:false,
    name:'Hipnotizar (Mesmerise)', type:'Activa (30% Vida)',
    effect:'Controla la mente de un enemigo común para que luche a tu lado temporalmente.',
    initial:'locked' },

  { id:'va_explosion_caos', tree:'vamp', x:55, y:85, ultimate:false,
    name:'Explosión del Caos (Blood Surge)', type:'Activa (3 Cargas)',
    effect:'Hace explotar la sangre del objetivo desde dentro. Causa daño masivo a jefes.',
    initial:'locked' },

  { id:'va_ultimate', tree:'vamp', x:50, y:92, ultimate:true,
    name:'Inmortalidad Umbría', type:'Ventaja Definitiva',
    effect:'Al recibir un golpe fatal, Coen evita la muerte, gana Lifesteal y se vuelve inmune por 10s.',
    initial:'locked' },

  /* ---------------- BRUJERÍA (WITCHCRAFT) ---------------- */
  { id:'wi_influencia', tree:'witch', x:85, y:15, ultimate:false,
    name:'Influencia Hechizante 1', type:'Pasiva Útil',
    effect:'Desbloquea precios reducidos y ofertas exclusivas en todos los mercaderes del Valle.',
    initial:'acquired' },

  { id:'wi_resistencia', tree:'witch', x:80, y:25, ultimate:false,
    name:'Resistencia Antinatural 1', type:'Pasiva',

    initial:'acquired' },

  { id:'wi_comunion', tree:'witch', x:90, y:25, ultimate:false,
    name:'Comunión Astral 1', type:'Pasiva de Mapa',
    effect:'Permite sintonizar con los lugares de poder ocultos para ganar bufos temporales.',
    initial:'acquired' },

  { id:'wi_forzar_alma', tree:'witch', x:85, y:40, ultimate:false,
    name:'Forzar Alma 1', type:'Pasiva de Lore',
    effect:'Habla con las almas en pena vinculadas a objetos para revelar secretos de misiones.',
    initial:'acquired' },

  { id:'wi_sangre_ardiente', tree:'witch', x:85, y:55, ultimate:false,
    name:'Sangre Ardiente 1', type:'Activa (15% Vida)',
    effect:'Prende fuego a la sangre del objetivo, infligiendo daño constante de quemadura por fuego.',
    initial:'acquired' },

  /* Nodos inferiores (Y > 60%): rama congelada, no interactivos */
  { id:'wi_frozen_1', tree:'witch', x:78, y:66, ultimate:false, frozen:true,
    name:'Rama Congelada', type:'—',
    effect:'Rama congelada temporalmente para optimizar la build híbrida.',
    initial:'frozen' },
  { id:'wi_frozen_2', tree:'witch', x:92, y:66, ultimate:false, frozen:true,
    name:'Rama Congelada', type:'—',
    effect:'Rama congelada temporalmente para optimizar la build híbrida.',
    initial:'frozen' },
  { id:'wi_frozen_3', tree:'witch', x:75, y:77, ultimate:false, frozen:true,
    name:'Rama Congelada', type:'—',
    effect:'Rama congelada temporalmente para optimizar la build híbrida.',
    initial:'frozen' },
  { id:'wi_frozen_4', tree:'witch', x:85, y:77, ultimate:false, frozen:true,
    name:'Rama Congelada', type:'—',
    effect:'Rama congelada temporalmente para optimizar la build híbrida.',
    initial:'frozen' },
  { id:'wi_frozen_5', tree:'witch', x:95, y:77, ultimate:false, frozen:true,
    name:'Rama Congelada', type:'—',
    effect:'Rama congelada temporalmente para optimizar la build híbrida.',
    initial:'frozen' },
  { id:'wi_frozen_6', tree:'witch', x:85, y:89, ultimate:false, frozen:true,
    name:'Rama Congelada', type:'—',
    effect:'Rama congelada temporalmente para optimizar la build híbrida.',
    initial:'frozen' },
];

const TREE_LABEL = { sword:'Esgrima', vamp:'Vampirismo', witch:'Brujería' };
const STATUS_LABEL = {
  acquired:'Adquirida',
  planned:'Planificada',
  frozen:'Congelada',
  locked:'Bloqueada'
};
const POINTS_TOTAL = 31;
const STORAGE_KEY = 'dawnwalker-build-planner-v1';

/* The Y coordinates in the database above are a schematic 15-92 layout.
   On this specific artwork the hexagons actually run from ~24% (first
   row, just under the column titles) to ~90% (last row, just above the
   footer bar) -- rendering the raw 15-92 values verbatim would float
   the top/bottom rows over the navbar and footer instead of on the
   tree. This remaps the schematic range onto that real band so the
   given layout (order, grouping, relative spacing) lands on the actual
   hexagons; X is left as given since it already sits safely inside
   each column. */
const Y_IN_MIN = 15, Y_IN_MAX = 92, Y_OUT_MIN = 24, Y_OUT_MAX = 90;
function calibrateY(y){
  return Y_OUT_MIN + (y - Y_IN_MIN) / (Y_IN_MAX - Y_IN_MIN) * (Y_OUT_MAX - Y_OUT_MIN);
}

/* Coste en puntos de una habilidad adquirida: usa el rango final del
   nombre ("... 2" -> 2 puntos) o 1 punto por defecto. */
function skillCost(skill){
  const m = skill.name.match(/(\d+)\s*$/);
  return m ? parseInt(m[1], 10) : 1;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveState(state){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* ignore */ }
}

let state = loadState();
SKILLS.forEach(s => { if(!(s.id in state)) state[s.id] = s.initial; });
saveState(state);

const board = document.getElementById('board');
const tooltip = document.getElementById('tooltip');
const highlights = {
  sword: document.getElementById('hl-sword'),
  vamp: document.getElementById('hl-vamp'),
  witch: document.getElementById('hl-witch'),
};
const ppSpentEl = document.getElementById('ppSpent');
const ppBarFillEl = document.getElementById('ppBarFill');

const NEXT_STATUS = { locked:'planned', planned:'acquired', acquired:'locked' };

function updatePoints(){
  let spent = 0;
  SKILLS.forEach(s => {
    if (s.frozen) return;
    if (state[s.id] === 'acquired') spent += skillCost(s);
  });
  ppSpentEl.textContent = spent;
  const pct = Math.min(100, (spent / POINTS_TOTAL) * 100);
  ppBarFillEl.style.width = pct + '%';
  ppBarFillEl.classList.toggle('over', spent > POINTS_TOTAL);
}

function buildNodes(){
  SKILLS.forEach(skill => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = `node tree-${skill.tree}` + (skill.ultimate ? ' ultimate' : '');
    el.style.left = skill.x + '%';
    el.style.top = calibrateY(skill.y) + '%';
    el.style.width = (skill.ultimate ? 5.2 : (skill.frozen ? 2.6 : 4.2)) + '%';
    el.dataset.status = state[skill.id];
    el.setAttribute('aria-label', `${skill.name} (${STATUS_LABEL[state[skill.id]]})`);

    el.addEventListener('mouseenter', () => showTooltip(el, skill));
    el.addEventListener('mousemove', (e) => positionTooltip(e));
    el.addEventListener('mouseleave', hideTooltip);
    el.addEventListener('focus', () => showTooltip(el, skill));
    el.addEventListener('blur', hideTooltip);

    el.addEventListener('click', (e) => {
      if (skill.frozen) return;
      state[skill.id] = NEXT_STATUS[state[skill.id]] || 'locked';
      saveState(state);
      el.dataset.status = state[skill.id];
      el.setAttribute('aria-label', `${skill.name} (${STATUS_LABEL[state[skill.id]]})`);
      showTooltip(el, skill);
      positionTooltip(e);
      updatePoints();
    });

    board.appendChild(el);
  });
}

function showTooltip(el, skill){
  const status = state[skill.id];
  tooltip.className = `tooltip visible tree-${skill.tree}`;
  tooltip.innerHTML = `
    <div class="tt-header">
      <span class="tt-name">${skill.name}</span>
      <span class="tt-type">${skill.type}</span>
    </div>
    <span class="tt-status st-${status}">${STATUS_LABEL[status]}</span>
    <div class="tt-desc">${skill.effect}</div>
    ${skill.frozen ? '' : '<div class="tt-hint">' + TREE_LABEL[skill.tree] + ' · click para alternar el estado</div>'}
  `;
  Object.values(highlights).forEach(h => h.style.opacity = 0);
  highlights[skill.tree].style.opacity = 1;
}

function hideTooltip(){
  tooltip.classList.remove('visible');
  Object.values(highlights).forEach(h => h.style.opacity = 0);
}

function positionTooltip(e){
  const margin = 18;
  const rect = tooltip.getBoundingClientRect();
  let x = e.clientX + margin;
  let y = e.clientY + margin;
  if (x + rect.width > window.innerWidth - 10) x = e.clientX - rect.width - margin;
  if (y + rect.height > window.innerHeight - 10) y = e.clientY - rect.height - margin;
  if (x < 10) x = 10;
  if (y < 10) y = 10;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}

document.getElementById('ppReset').addEventListener('click', () => {
  if (!confirm('¿Reiniciar la build a su estado inicial? Se perderán los cambios planificados.')) return;
  SKILLS.forEach(s => { state[s.id] = s.initial; });
  saveState(state);
  document.querySelectorAll('.node').forEach((el, i) => {
    const skill = SKILLS[i];
    el.dataset.status = state[skill.id];
    el.setAttribute('aria-label', `${skill.name} (${STATUS_LABEL[state[skill.id]]})`);
  });
  hideTooltip();
  updatePoints();
});

buildNodes();
updatePoints();
</script>
</body>
